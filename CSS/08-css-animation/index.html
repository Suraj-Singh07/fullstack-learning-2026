<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 100vw;
        height: 100vh;
        background-color: #00592f;
        border: 1px solid red;
      }

      .box {
        width: 60px;
        height: 60px;
        background-color: #a501a5;
        border: 1px solid orange;
        /* transform: translate(100px, 50px); */
        /* transform: translateX(100px); */
        /* transform: translateY(100px); */
        /* transform: scale(0.5); */
        /* transform: rotate(12deg); */
        /* transform: rotateY(70deg); */
        /* transform: skew(20deg); */
        /* transform: skewY(20deg); */
        /* transform: translateX(50px) rotate(10deg) scale(1.1); */
        /* transform-origin: top left; */
        /* transform-origin: 0 0; */
        /* transition: transform 0.4s ease,
                        background-color 0.4s ease,
                        color 0.4s ease,
                        box-shadow 0.4s ease; */
        animation: move 2s infinite linear 1s;
        /* animation-iteration-count: 3; */
        /* animation-direction: alternate; */
        /* animation-delay: 1s; */
      }

      /* .box:hover{
            transform: translateX(50px) rotate(10deg) scale(1.3);
            background-color: #6c02c9;
            color: aqua;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 1.5);
        } */

      @keyframes move {
        0% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(100px, 0);
        }
        50% {
          transform: translate(100px, 200px);
        }
        75% {
          transform: translate(0, 200px);
        }
        100% {
          transform: translate(0, 0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">box</div>
    </div>
  </body>
</html>
